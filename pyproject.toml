[project]
name = "iotcloud-health-check"
version = "0.2.0"
description = "Health check monitoring service for the IotCloud platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.7.0",
    "requests>=2.32.0",
]

[project.scripts]
iotcloud-health = "iotcloud_health.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iotcloud_health"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["iotcloud_health"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
